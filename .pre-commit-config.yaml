# Todas as revisões travadas. Atualizar só deliberadamente, nunca por `autoupdate`.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Rodam via npm no node_modules do projeto, não num ambiente isolado do
  # pre-commit: precisam ver as versões exatas de package-lock.json.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write
        language: system
        types_or: [ts, tsx, javascript, json, css, markdown, yaml]

      - id: eslint
        name: eslint
        entry: npx --no-install eslint --fix
        language: system
        types_or: [ts, tsx, javascript]

      - id: typecheck
        name: typecheck
        entry: npm run typecheck
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

      - id: vitest
        name: vitest
        entry: npm test
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
